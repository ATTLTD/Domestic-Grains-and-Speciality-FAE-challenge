<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>「國產雜糧好味道 在地特作風味好」食農知識小挑戰</title>
<!-- ===== 社群分享預覽（Facebook、LINE 會讀取這裡）=====
     若分享導向體驗版，og:url 請保留結尾的 ?mode=share（臉書會以 og:url 作為點擊後的落地網址），
     並將 og-image.jpg 上傳到同一個 repository 根目錄。
     這些設定必須寫在檔案中，無法用編輯模式修改（臉書不會執行網頁程式）。 -->
<meta name="description" content="答對 4 題即可通過挑戰，一起來測測你的食農知識！">
<meta property="og:type" content="website">
<meta property="og:url" content="https://attltd.github.io/Domestic-Grains-and-Speciality-FAE-challenge/?mode=share">
<meta property="og:title" content="「國產雜糧好味道 在地特作風味好」食農知識小挑戰">
<meta property="og:description" content="答對 4 題即可通過挑戰，一起來測測你的國產雜糧特作食農知識！">
<meta property="og:image" content="https://attltd.github.io/Domestic-Grains-and-Speciality-FAE-challenge/og-image.jpg">
<meta property="og:image:secure_url" content="https://attltd.github.io/Domestic-Grains-and-Speciality-FAE-challenge/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="國產雜糧特作食農知識小挑戰">
<meta property="og:locale" content="zh_TW">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 配色取自活動主視覺：深綠（標題字）、橘（好味道）、米色（帆布袋底色） */
  --bg:#E3D6C6; --surface:#FBF8F2; --ink:#2E3527; --muted:#6A6F5C; --line:#DCD3C2;
  --primary:#4F6B3C; --primary-ink:#FFFFFF; --primary-soft:#E6ECD4;
  --marigold:#EDA347; --bad:#C2453A; --good:#3E8A4E;
  --display:"Huninn","jf open 粉圓","PingFang TC","Noto Sans TC",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151A12; --surface:#1E241A; --ink:#ECEBDF; --muted:#A7AB96; --line:#323A2B;
    --primary:#A9C47E; --primary-ink:#151A12; --primary-soft:#2A3322; --good:#6FC07F; --bad:#EF7A6E;
  }
}
:root[data-theme="dark"]{
--bg:#151A12; --surface:#1E241A; --ink:#ECEBDF; --muted:#A7AB96; --line:#323A2B;
  --primary:#A9C47E; --primary-ink:#151A12; --primary-soft:#2A3322; --good:#6FC07F; --bad:#EF7A6E;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}

#app{max-width:480px;margin:0 auto;min-height:100%;background:var(--surface);position:relative;display:flex;flex-direction:column}
.page{display:none;flex:1;flex-direction:column}
.page.on{display:flex}

body.booting .overlay,body.booting .btxt{visibility:hidden}
/* Banner */
.banner{position:relative;aspect-ratio:3/1;background:var(--primary);overflow:hidden;flex:none}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner .btxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 20px;text-align:center;
  font-family:var(--display);font-size:clamp(20px,6vw,28px);color:#fff;letter-spacing:.04em;
  background-image:radial-gradient(rgba(255,255,255,.18) 1.2px,transparent 1.3px);background-size:14px 14px}
.banner.has-img .btxt{display:none}

/* Stage with editable background + overlay text */
.stage{position:relative;flex:1;min-height:420px;display:flex;flex-direction:column;overflow:hidden}
.stage .bg{position:absolute;inset:0;background-size:cover;background-position:center;
  background-color:#ECE2D3;
  background-image:radial-gradient(color-mix(in srgb,var(--primary) 16%,transparent) 1.5px,transparent 1.6px);background-size:18px 18px}
.stage .scrim{position:absolute;inset:0;display:none;background:linear-gradient(180deg,rgba(10,14,24,0) 25%,rgba(10,14,24,.72) 100%)}
/* 底圖區的文字顏色：
   - 沒有底圖時，底色固定為淺米色，文字固定為深色（不受手機深色模式影響）
   - 有底圖時，依「文字顏色」設定：白色字（加暗色漸層）或深色字（加淺色漸層）；「自動」依底圖亮度判斷 */
.stage{--ink:#2E3527;--muted:#5E634F;--surface:#FBF8F2;--line:#DCD3C2;--primary:#4F6B3C;--primary-ink:#FFFFFF;--primary-soft:#E6ECD4;--bad:#C2453A}
.stage .overlay{color:var(--ink)}
.stage.has-img .scrim{display:block}
.stage.has-img .overlay{color:#fff}
.stage.has-img .overlay .sub,.stage.has-img .overlay .note{color:rgba(255,255,255,.88)}
.hero{position:relative;display:block;width:100%;max-width:440px;margin:8px auto 0;height:auto;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.stage.hero-mode .bg{background:#E3D6C6}
.stage.hero-mode .overlay{color:#2E3527;padding-top:8px}
.stage.hero-mode .overlay .sub{color:#5E634F}
.stage.hero-mode .rules{color:#2E3527}
.overlay{position:relative;margin-top:auto;padding:32px 24px 36px}
.overlay h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,40px);line-height:1.2;margin:0 0 10px;letter-spacing:.02em}
.overlay .sub{margin:0 0 22px;color:var(--muted);font-size:17px}
.overlay .sub.soldout{color:var(--bad);font-weight:700}
.stage.has-img .overlay .sub.soldout{color:#FFD7D3}
.rules{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:8px;font-size:15px}
.rules li{display:flex;gap:10px;align-items:flex-start}
.rules li::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;border-radius:2px;background:var(--marigold);transform:rotate(45deg)}

.btn{display:flex;width:100%;align-items:center;justify-content:center;min-height:56px;border:0;border-radius:14px;
  background:var(--primary);color:var(--primary-ink);font-family:var(--display);font-size:20px;letter-spacing:.06em;cursor:pointer;
  box-shadow:0 4px 0 color-mix(in srgb,var(--primary) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--primary) 60%,#000)}
.stage.has-img .btn.ghost{color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.stage.has-img:not(.tone-dark) .demo-flag{color:rgba(255,255,255,.75)}
/* 深色字模式（淺色底圖）*/
.stage.has-img.tone-dark .scrim{display:block;background:linear-gradient(180deg,rgba(251,248,242,0) 20%,rgba(251,248,242,.82) 62%,rgba(251,248,242,.9) 100%)}
.stage.has-img.tone-dark .overlay{color:var(--ink)}
.stage.has-img.tone-dark .overlay .sub,.stage.has-img.tone-dark .overlay .note{color:var(--muted)}
.stage.has-img.tone-dark .overlay .sub.soldout{color:var(--bad)}
.stage.has-img.tone-dark .btn.ghost{color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.stage.has-img.tone-dark .stamp{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);font-family:var(--body);font-size:16px;letter-spacing:0}

/* Quiz */
.progress{position:sticky;top:0;z-index:5;background:var(--surface);padding:12px 20px 10px;border-bottom:1px solid var(--line)}
.progress .row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.progress .row b{color:var(--ink)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.segs i{height:6px;border-radius:3px;background:var(--line);transition:background .2s}
.segs i.done{background:var(--primary)}
.qlist{padding:8px 20px 24px}
.q{padding:24px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.qhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.qnum{flex:none;font-family:var(--display);font-size:34px;line-height:1;color:var(--primary);min-width:28px}
.qtext{font-size:18px;font-weight:500;line-height:1.5;margin:0}
.qtag{display:inline-block;margin-top:6px;font-size:13px;padding:1px 8px;border-radius:6px;background:var(--primary-soft);color:var(--primary)}
.qtag.multi{background:color-mix(in srgb,var(--marigold) 22%,transparent);color:color-mix(in srgb,var(--marigold) 55%,var(--ink))}
.opts{display:grid;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mark{flex:none;width:22px;height:22px;border:2px solid var(--muted);display:grid;place-items:center}
.opt.single .mark{border-radius:50%}
.opt.multi .mark{border-radius:6px}
.opt .mark::after{content:"";width:10px;height:10px;background:var(--primary-ink);opacity:0}
.opt.single .mark::after{border-radius:50%}
.opt.multi .mark::after{width:6px;height:11px;background:transparent;border:solid var(--primary-ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.opt:has(input:checked) .mark{background:var(--primary);border-color:var(--primary)}
.opt:has(input:checked) .mark::after{opacity:1}
.opt:has(input:focus-visible){outline:3px solid var(--marigold);outline-offset:2px}
.submitbar{position:sticky;bottom:0;z-index:5;background:var(--surface);padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.submitbar .hint{text-align:center;font-size:13px;color:var(--muted);margin:0 0 8px}

/* Result */
.resultbox{display:flex;flex-direction:column;align-items:center;text-align:center}
.resultbox h1{margin-bottom:18px}
.stamp{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;position:relative;margin:4px 0 18px;
  border:6px double var(--muted);color:var(--muted);transform:rotate(-8deg);background:color-mix(in srgb,var(--surface) 82%,transparent)}
.stamp.pass{border-color:var(--marigold);color:color-mix(in srgb,var(--marigold) 70%,var(--ink))}
.stamp .pct{font-family:var(--display);font-size:64px;line-height:1}
.stamp .pct small{font-size:28px}
.stamp .lbl{font-size:14px;margin-top:2px}
.stage.has-img .stamp{background:rgba(255,255,255,.92);color:var(--ink)}
.stage.has-img .stamp.pass{color:#9A5F12}
.rate-line{font-size:18px;margin:0 0 6px}
.rate-line b{font-family:var(--display);font-weight:400;font-size:24px}
@media (prefers-reduced-motion:no-preference){
  .stamp.animate{animation:press .55s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes press{0%{transform:scale(1.8) rotate(-18deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:1}}
}
.ticket{width:100%;max-width:320px;margin:18px auto 8px;display:flex;border-radius:14px;overflow:hidden;background:var(--marigold);color:#2A1A00;
  -webkit-mask:radial-gradient(circle 10px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 10px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.ticket .l{flex:none;width:74px;display:grid;place-items:center;border-right:2px dashed rgba(42,26,0,.35);font-family:var(--display);font-size:16px;line-height:1.3;text-align:center;letter-spacing:.1em}
.ticket .r{flex:1;padding:14px 16px;text-align:left}
.ticket .r span{font-size:13px;opacity:.8}
.ticket .r strong{display:block;font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.08em;line-height:1.2}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
.demo-flag{font-size:12px;color:var(--muted);margin-top:10px;opacity:.8}

.share{padding:22px 20px calc(26px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.share p{margin:0 0 12px;text-align:center;font-size:14px;color:var(--muted)}
.share .row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:0;border-radius:14px;background:var(--bg);cursor:pointer;text-decoration:none;color:var(--ink);font-size:13px}
.sbtn .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.ic.line{background:#06C755}
.ic.ig{background:linear-gradient(45deg,#F9A825,#E1306C 50%,#7B3FE4)}
.ic.fb{background:#1877F2}
.ic svg{width:24px;height:24px}

/* Review */
.review{padding:24px 20px calc(32px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.review h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 4px}
.review .legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:0 0 8px}
.review .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.rv{padding:18px 0;border-bottom:1px dashed var(--line)}
.rv:last-child{border-bottom:0}
.rv-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.rv-badge{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
.rv.rv-ok .rv-badge{background:var(--good)}
.rv.rv-ng .rv-badge{background:var(--bad)}
.rv-q{margin:0;font-weight:500;line-height:1.5}
.rv-q small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.rv-opts{display:grid;gap:8px;padding-left:42px}
.rv-opt{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:15px}
.rv-opt em{font-style:normal;font-size:12px;flex:none;padding:1px 8px;border-radius:6px}
.rv-opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface));color:color-mix(in srgb,var(--good) 70%,var(--ink))}
.rv-opt.correct em{background:var(--good);color:#fff}
.rv-opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:color-mix(in srgb,var(--bad) 75%,var(--ink))}
.rv-opt.wrong em{background:var(--bad);color:#fff}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-size:14px;max-width:min(420px,90vw);text-align:center;transition:.25s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Admin */
.admin-fab{position:fixed;right:max(12px,calc(50vw - 240px + 12px));top:calc(12px + env(safe-area-inset-top,0px));z-index:30;display:none;
  border:0;border-radius:999px;padding:10px 16px;background:var(--ink);color:var(--surface);font-size:14px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.admin-fab.on{display:block}
.sheet{position:fixed;inset:0;z-index:40;display:none;background:rgba(10,14,24,.5)}
.sheet.on{display:block}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;top:env(safe-area-inset-top,0px);max-width:480px;margin:0 auto;background:var(--surface);
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet header h2{margin:0;font-size:18px}
.sheet .body{flex:1;overflow:auto;padding:4px 18px 24px}
.sheet footer{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet footer .btn{min-height:48px;font-size:17px}
.fs{border:0;margin:0;padding:18px 0;border-bottom:1px solid var(--line)}
.fs legend{font-weight:700;padding:0;margin-bottom:10px}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.field input[type=text],.field textarea{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.field textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.imgpick{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.imgpick .thumb{width:84px;height:48px;border-radius:8px;background:var(--bg) center/cover no-repeat;border:1.5px solid var(--line);flex:none}
.imgpick .meta{flex:1;font-size:14px}
.imgpick .acts{display:flex;gap:6px}
.mini{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.mini.danger{color:var(--bad)}
.err{color:var(--bad);font-size:13px;margin:4px 0 0}
.ok{color:var(--good);font-size:13px;margin:4px 0 0}
.mode-note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin:14px 0 0}
</style>
</head>
<body>
<div id="app">

  <!-- 首頁 -->
  <section class="page on" id="p-home" aria-label="首頁">
    <div class="banner" data-banner="home"><img alt="" hidden><div class="btxt"></div></div>
    <div class="stage" data-stage="home">
      <div class="bg"></div><div class="scrim"></div>
      <img class="hero" id="homeHero" alt="" hidden>
      <div class="overlay">
        <h1 data-t="home.title"></h1>
        <p class="sub" data-t="home.subtitle"></p>
        <ul class="rules" id="rules"></ul>
        <button class="btn" id="startBtn" disabled>載入中</button>
        <button class="btn ghost" id="mySerialBtn" type="button" hidden style="margin-top:12px">查看我的兌換序號</button>
      </div>
    </div>
  </section>

  <!-- 答題頁 -->
  <section class="page" id="p-quiz" aria-label="答題頁">
    <div class="banner" data-banner="quiz"><img alt="" hidden><div class="btxt"></div></div>
    <div class="progress" aria-live="polite">
      <div class="row"><span>已作答 <b id="doneCount">0</b> / <span id="totalCount">5</span></span><span>單選 ○　複選 □</span></div>
      <div class="segs" id="segs"></div>
    </div>
    <form class="qlist" id="qlist" onsubmit="return false"></form>
    <div class="submitbar">
      <p class="hint" id="submitHint"></p>
      <button class="btn" id="submitBtn" disabled>送出答案</button>
    </div>
  </section>

  <!-- 結果頁 -->
  <section class="page" id="p-result" aria-label="結果頁">
    <div class="banner" data-banner="result"><img alt="" hidden><div class="btxt"></div></div>
    <div class="stage" data-stage="result">
      <div class="bg"></div><div class="scrim"></div>
      <div class="overlay resultbox">
        <h1 id="resTitle"></h1>
        <div class="stamp" id="stamp"><div><div class="pct"><span id="pct">0</span><small>%</small></div><div class="lbl">正確率</div></div></div>
        <p class="rate-line">您的答題正確率為 <b id="pct2">0</b><b>%</b></p>
        <div id="ticketWrap" hidden>
          <div class="ticket"><div class="l">兌換<br>序號</div><div class="r"><span>No.</span><strong id="serial">—</strong></div></div>
        </div>
        <p class="note" id="resNote"></p>
        <p class="demo-flag" id="demoFlag" hidden></p>
        <button class="btn" id="replayBtn" type="button" style="margin-top:22px">再挑戰一次</button>
      </div>
    </div>
    <div class="share">

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
function deepMerge(base, over){
  if(!over || typeof over !== "object") return base;
  const out = Array.isArray(base) ? base.slice() : {...base};
  for(const k of Object.keys(over)){
    const v = over[k];
    out[k] = (v && typeof v === "object" && !Array.isArray(v) && base && typeof base[k] === "object" && !Array.isArray(base[k]))
      ? deepMerge(base[k], v) : v;
  }
  return out;
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function cookieGet(k){ try{ const m=document.cookie.match(new RegExp("(?:^|; )"+k+"=([^;]*)")); return m?decodeURIComponent(m[1]):null; }catch(e){ return null; } }
function cookieSet(k,v){ try{ document.cookie=k+"="+encodeURIComponent(v)+"; max-age=31536000; path=/; SameSite=Lax"; }catch(e){} }
function cookieDel(k){ try{ document.cookie=k+"=; max-age=0; path=/"; }catch(e){} }
function uuid(){ return (crypto.randomUUID ? crypto.randomUUID() : "d"+Date.now().toString(36)+Math.random().toString(36).slice(2)); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),3200); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pad(n,d){ return String(n).padStart(d,"0"); }

/* 裝置識別：localStorage + cookie 雙重保存的隨機裝置碼 */
function getDeviceId(){
  let id = lsGet("quiz_device_id") || cookieGet("qdid");
  if(!id){ id = uuid(); }
  lsSet("quiz_device_id", id); cookieSet("qdid", id);
  return id;
}
function getLocalRecord(){
  const raw = lsGet("quiz_record") || cookieGet("qrec");
  try{ return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function setLocalRecord(rec){
  lsSet("quiz_record", JSON.stringify(rec));
  const {review, ...slim} = rec; cookieSet("qrec", JSON.stringify(slim)); // cookie 容量有限，不存逐題明細
}
function clearLocalRecord(){ lsDel("quiz_record"); cookieDel("qrec"); }

/* 圖片壓縮：轉 JPEG 並控制大小（存放上限約 240KB） */
function compressImage(file, maxW){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("讀取圖片失敗"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("圖片格式無法辨識"));
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        let scale = Math.min(1, maxW / w);
        const c = document.createElement("canvas");
        let q = 0.85, out = "";
        for(let i=0;i<8;i++){
          c.width = Math.round(w*scale); c.height = Math.round(h*scale);
          const ctx = c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL("image/jpeg", q);
          if(out.length < 240000) break;
          if(q > 0.6) q -= 0.1; else scale *= 0.8;
        }
        resolve(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* =========================================================
   3. 後端介面（三種模式擇一）
   - claude ：發布在 claude.ai，使用平台共用資料庫（序號全域依序跳號）
   - api    ：自行架站 + 自有後端（例如 Google Apps Script）
   - local  ：無後端時的本機示範模式（序號只在本機遞增，僅供測試）
   ========================================================= */
/* 可重複遊玩：紀錄保存「最近一次結果」與「此裝置唯一的序號」
   serial 一旦取得就永久保留；再次通過時 repass = true，不再發新序號 */
function nextRecord(prev, rate, passed, review, newSerial, soldOut){
  const serial = (prev && prev.serial != null) ? prev.serial : (newSerial ?? null);
  return {
    rate, passed, review, at: Date.now(),
    serial,
    soldOut: !!(passed && serial == null && soldOut),
    repass: !!(passed && prev && prev.serial != null),
    plays: ((prev && prev.plays) || 0) + 1
  };
}

function localBackend(){
  return {
    mode:"local", canEdit: new URLSearchParams(location.search).get("admin")==="1",
    async getRecord(){ return getLocalRecord(); },
    async getStatus(){ const issued = Number(lsGet("quiz_demo_counter")||0); return {issued, limit: site.serialLimit}; },
    async submit(rate, passed, review){
      const prev = getLocalRecord();
      let newSerial = null, soldOut = false;
      if(passed && !(prev && prev.serial != null)){
        const issued = Number(lsGet("quiz_demo_counter")||0);
        if(issued >= site.serialLimit) soldOut = true;
        else { newSerial = issued + 1; lsSet("quiz_demo_counter", String(newSerial)); }
      }
      const rec = nextRecord(prev, rate, passed, review, newSerial, soldOut);
      setLocalRecord(rec); return rec;
    },
    async resetMine(){ clearLocalRecord(); },
    async loadSite(){
      let cfg = null, imgs = {};
      try{ cfg = JSON.parse(lsGet("quiz_site_cfg")||"null"); }catch(e){}
      try{ imgs = JSON.parse(lsGet("quiz_site_imgs")||"{}"); }catch(e){}
      return {cfg, imgs};
    },
    async saveSite(cfg, imgs){
      lsSet("quiz_site_cfg", JSON.stringify(cfg));
      if(!lsSet("quiz_site_imgs", JSON.stringify(imgs))) throw new Error("圖片太大，瀏覽器儲存空間不足");
    }
  };
}

function claudeBackend(db, user, uid, canEdit){
  const stateRef = db.doc("data/users/"+uid+"/state");
  const siteRef = db.doc("data/site");
  const counterRef = db.doc("data/counter");
  // 回傳新序號；已達上限時回傳 null
  async function claimSerial(limit){
    const holder = uid + "-" + Math.random().toString(36).slice(2,8);
    for(let i=0;i<25;i++){
      const r = await counterRef.acquire({holder, ttlMs:5000});
      if(r.acquired){
        const s = await counterRef.get();
        const issued = (s.exists && Number(s.data().n)) ? Number(s.data().n) : 0;
        if(issued >= limit) return null;
        const n = issued + 1;
        await counterRef.set({n, updatedAt: Date.now()});
        return n;
      }
      await sleep(250 + Math.random()*450);
    }
    throw new Error("序號發放忙碌中");
  }
  return {
    mode:"claude", canEdit,
    async getRecord(){
      const s = await stateRef.get();
      return (s.exists && s.data().record) ? s.data().record : null;
    },
    async getStatus(){
      const s = await counterRef.get();
      return {issued: (s.exists && Number(s.data().n)) || 0, limit: site.serialLimit};
    },
    async submit(rate, passed, review){
      const prev = await this.getRecord();
      let newSerial = null, soldOut = false;
      if(passed && !(prev && prev.serial != null)){
        newSerial = await claimSerial(site.serialLimit);
        soldOut = newSerial == null;
      }
      const rec = nextRecord(prev, rate, passed, review, newSerial, soldOut);
      await stateRef.set({record: rec});
      return rec;
    },
    async resetMine(){ await stateRef.delete(); clearLocalRecord(); },
    async loadSite(){
      const s = await siteRef.get();
      let cfg = null;
      if(s.exists && s.data().config){ try{ cfg = JSON.parse(s.data().config); }catch(e){} }
      const imgs = {};
      await Promise.all(Object.keys(IMG_KEYS).map(async k => {
        const d = await db.doc("data/site/img/"+k).get();
        if(d.exists && d.data().src) imgs[k] = d.data().src;
      }));
      return {cfg, imgs};
    },
    async saveSite(cfg, imgs, changed){
      await siteRef.set({config: JSON.stringify(cfg), updatedAt: Date.now()});
      for(const k of changed){
        const ref = db.doc("data/site/img/"+k);
        if(imgs[k]) await ref.set({src: imgs[k]}); else await ref.delete();
      }
    }
  };
}

function apiBackend(){
  const deviceId = getDeviceId();
  async function call(action, extra){
    const r = await fetch(CONFIG.apiEndpoint, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({action, deviceId, ...extra})});
    const j = await r.json(); if(!j.ok) throw new Error(j.error||"伺服器錯誤"); return j;
  }
  const lb = localBackend();
  return {
    mode:"api", canEdit: lb.canEdit, sheetQuestions:false, adminKey:"",
    async loadSite(){
      const j = await call("site");
      if(j.issued != null) this._status = {issued: Number(j.issued), limit: Number(j.limit)};
      let cfg = j.cfg || null;
      if(Array.isArray(j.questions) && j.questions.length){ cfg = {...(cfg||{}), questions: j.questions}; this.sheetQuestions = true; }
      return {cfg, imgs: j.imgs || {}};
    },
    async saveSite(cfg, imgs){
      if(!this.adminKey) throw new Error("請先輸入管理密碼");
      const body = this.sheetQuestions ? {...cfg, questions:null} : cfg;
      try{ await call("saveSite", {adminKey: this.adminKey, cfg: body, imgs}); }
      catch(e){ throw new Error(e.message === "unauthorized" ? "管理密碼錯誤" : e.message); }
    },
    async getStatus(){
      if(this._status) return this._status;
      const j = await call("site"); return {issued: Number(j.issued)||0, limit: Number(j.limit)||site.serialLimit};
    },
    async getRecord(){ const loc = getLocalRecord(); if(loc) return loc; const j = await call("check"); if(j.record) setLocalRecord(j.record); return j.record; },
    async submit(rate, passed, review){ const j = await call("submit", {rate}); const rec = {...j.record, review, at: Date.now()}; setLocalRecord(rec); return rec; },
    async resetMine(){ clearLocalRecord(); }
  };
}

async function initBackend(){
  if(CONFIG.apiEndpoint) return apiBackend();
  if(window.claude && typeof window.claude.use === "function"){
    try{
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if(db && user){
        const uid = await user.id();
        const canEdit = await user.canEdit().catch(()=>false);
        if(uid) return claudeBackend(db, user, uid, !!canEdit);
      }
    }catch(e){ console.warn("db 無法使用，改用本機示範模式", e); }
  }
  return localBackend();
}

/* 計算底圖下半部（文字所在區域）的平均亮度，0 = 全黑、1 = 全白 */
const lumaCache = {};
function imageLuma(src){
  if(lumaCache[src]) return lumaCache[src];
  return lumaCache[src] = new Promise(res => {
    const i = new Image();
    i.onload = () => {
      try{
        const c = document.createElement("canvas"); c.width = 40; c.height = 40;
        const x = c.getContext("2d"); x.drawImage(i, 0, 0, 40, 40);
        const d = x.getImageData(0, 16, 40, 24).data; let t = 0;
        for(let k = 0; k < d.length; k += 4) t += 0.2126*d[k] + 0.7152*d[k+1] + 0.0722*d[k+2];
        res(t / (d.length/4) / 255);
      }catch(e){ res(0); }
    };
    i.onerror = () => res(0);
    i.src = src;
  });
}
function applyTone(el, src, tone){
  if(!src){ el.classList.remove("tone-dark"); return; }
  if(tone === "dark"){ el.classList.add("tone-dark"); return; }
  if(tone === "light"){ el.classList.remove("tone-dark"); return; }
  imageLuma(src).then(l => el.classList.toggle("tone-dark", l > 0.6));
}

/* ---- 答題 ---- */
function buildQuiz(){
  const picked = shuffle(bank()).slice(0, site.questionCount);
  current = picked.map(q => {
    const order = shuffle(q.options.map((_,i)=>i));
    return {q, order};
  });
  const form = $("#qlist"); form.innerHTML = "";
  current.forEach((item, qi) => {
    const multi = item.q.type === "multi";
    const wrap = document.createElement("fieldset");
    wrap.className = "q"; wrap.style.border = "0"; wrap.style.margin = "0";
    const head = document.createElement("div"); head.className = "qhead";
    const num = document.createElement("div"); num.className = "qnum"; num.textContent = qi+1;
    const txt = document.createElement("div");
    const lg = document.createElement("legend"); lg.className = "qtext"; lg.textContent = item.q.q;
    const tag = document.createElement("span"); tag.className = "qtag" + (multi?" multi":""); tag.textContent = multi ? "複選（可選多項）" : "單選";
    txt.append(lg, tag); head.append(num, txt);
    const opts = document.createElement("div"); opts.className = "opts";
    item.order.forEach(oi => {
      const lab = document.createElement("label"); lab.className = "opt " + (multi?"multi":"single");
      const inp = document.createElement("input");
      inp.type = multi ? "checkbox" : "radio"; inp.name = "q"+qi; inp.value = oi;
      inp.addEventListener("change", updateProgress);
      const mk = document.createElement("span"); mk.className = "mark"; mk.setAttribute("aria-hidden","true");
      const t = document.createElement("span"); t.textContent = item.q.options[oi];
      lab.append(inp, mk, t); opts.appendChild(lab);
    });
    wrap.append(head, opts); form.appendChild(wrap);
  });
  $("#totalCount").textContent = site.questionCount;
  const segs = $("#segs"); segs.innerHTML = ""; segs.style.gridTemplateColumns = `repeat(${site.questionCount},1fr)`;
  for(let i=0;i<site.questionCount;i++) segs.appendChild(document.createElement("i"));
  updateProgress();
}
function answersOf(qi){ return [...document.querySelectorAll(`input[name="q${qi}"]:checked`)].map(i => Number(i.value)); }
function updateProgress(){
  let done = 0; const segs = $("#segs").children;
  current.forEach((_,qi) => { const a = answersOf(qi).length>0; if(a) done++; segs[qi] && segs[qi].classList.toggle("done", a); });
  $("#doneCount").textContent = done;
  const left = current.length - done;
  $("#submitBtn").disabled = left > 0;
  $("#submitHint").textContent = left > 0 ? `還有 ${left} 題未作答` : "全部作答完成，送出後無法修改";
}
async function submitQuiz(){
  const btn = $("#submitBtn"); btn.disabled = true; btn.textContent = "送出中…";
  try{ await backendReady; }catch(e){}
  if(!backend) backend = localBackend();
  let correct = 0;
  const review = current.map((item, qi) => {
    const chosenOrig = answersOf(qi);
    const ok = chosenOrig.slice().sort().join(",") === item.q.answer.slice().sort().join(",");
    if(ok) correct++;
    // 以玩家看到的選項順序保存
    return {
      q: item.q.q, type: item.q.type, ok,
      opts: item.order.map(oi => item.q.options[oi]),
      correct: item.order.map((oi, di) => item.q.answer.includes(oi) ? di : -1).filter(i => i >= 0),
      chosen: item.order.map((oi, di) => chosenOrig.includes(oi) ? di : -1).filter(i => i >= 0)
    };
  });
  const rate = Math.round(correct / current.length * 100);
  const passed = rate >= site.passThreshold;
  if(NO_SERIAL){
    // 體驗版：只在畫面上顯示結果，不送後端、不保存紀錄
    record = {rate, passed, review, serial:null, shareMode:true, at:Date.now()};
    renderResult(record, true); updateStartBtn(); show("p-result");
    btn.textContent = "送出答案";
    return;
  }
  try{
    record = await backend.submit(rate, passed, review);
  }catch(e){
    console.error(e);
    const prev = record || getLocalRecord();
    record = {...nextRecord(prev, rate, passed, review, null), error:true};
    setLocalRecord(record);
    toast("連線失敗，結果未能送出至伺服器，請稍後再嘗試。");
  }
  setLocalRecord(record);
  if(record.soldOut) serialStatus = {issued: site.serialLimit, limit: site.serialLimit};
  else if(record.serial != null && serialStatus && !record.repass) serialStatus.issued = Math.max(serialStatus.issued, record.serial);
  applySite();
  renderResult(record, true);
  updateStartBtn();
  show("p-result");
  btn.textContent = "送出答案";
}

/* ---- 結果 ---- */
function renderResult(rec, animate, serialView){
  $("#pct").textContent = rec.rate; $("#pct2").textContent = rec.rate;
  const repass = !!(rec.passed && rec.repass && !rec.shareMode);
  $("#resTitle").textContent = rec.passed ? (repass ? site.result.repassTitle : site.result.passTitle) : site.result.failTitle;
  const stamp = $("#stamp"); stamp.classList.toggle("pass", !!rec.passed);
  stamp.classList.remove("animate"); if(animate){ void stamp.offsetWidth; stamp.classList.add("animate"); }
  // 序號券：本次通過時顯示；從首頁「查看我的兌換序號」進入時也顯示
  const owns = rec.serial != null;
  const showTicket = owns && (rec.passed || serialView);
  $("#ticketWrap").hidden = !showTicket;
  if(owns) $("#serial").textContent = pad(rec.serial, site.serialDigits);
  let note;
  if(rec.shareMode) note = rec.passed ? site.result.shareNote : site.result.failNote;
  else if(rec.passed) note = owns ? (repass ? site.result.repassNote : site.result.passNote)
    : (rec.soldOut ? site.result.soldOutNote : "序號暫時無法取得，請稍後再嘗試。");
  else note = site.result.failNote + (owns ? `（您先前取得的兌換序號 No. ${pad(rec.serial, site.serialDigits)} 仍然有效）` : "");
  $("#resNote").textContent = note;
  const flag = $("#demoFlag");
  flag.hidden = !(backend && backend.mode === "local") || !!rec.shareMode;
  flag.textContent = "目前為本機示範模式，序號僅在此裝置遞增，正式上線需接後端。";
  updateShareLinks();
  renderReview(rec.review);
  prepareShareImage();
}
/* 預先產生分享圖，讓點擊分享時能立即開啟分享選單（部分手機瀏覽器要求在點擊後短時間內呼叫） */
let shareImageCache = { key: "", blob: null };
function shareImageKey(){ return record ? [record.rate, record.passed, site.share.imageTitle, site.gameTitle].join("|") : ""; }
function prepareShareImage(){
  const key = shareImageKey(); if(!key || shareImageCache.key === key) return;
  shareImageCache = { key, blob: null };
  setTimeout(() => { makeShareImage().then(b => { if(shareImageCache.key === key) shareImageCache.blob = b; }).catch(() => {}); }, 300);
}
async function getShareImageFile(){
  const key = shareImageKey();
  const blob = (shareImageCache.key === key && shareImageCache.blob) ? shareImageCache.blob : await makeShareImage();
  return new File([blob], "quiz-result.jpg", { type: "image/jpeg" });
}
function renderReview(list){
  const box = $("#review"), wrap = $("#reviewList");
  wrap.innerHTML = "";
  if(!Array.isArray(list) || !list.length){ box.hidden = true; return; }
  list.forEach((r, i) => {
    const el = document.createElement("div"); el.className = "rv " + (r.ok ? "rv-ok" : "rv-ng");
    const head = document.createElement("div"); head.className = "rv-head";
    const badge = document.createElement("span"); badge.className = "rv-badge"; badge.textContent = r.ok ? "✓" : "✗";
    badge.setAttribute("aria-label", r.ok ? "答對" : "答錯");
    const q = document.createElement("p"); q.className = "rv-q"; q.textContent = (i+1) + ". " + r.q;
    const meta = document.createElement("small"); meta.textContent = (r.type === "multi" ? "複選" : "單選") + "｜" + (r.ok ? "答對" : "答錯");
    q.appendChild(meta); head.append(badge, q);
    const opts = document.createElement("div"); opts.className = "rv-opts";
    r.opts.forEach((t, di) => {
      const isCorrect = r.correct.includes(di), isChosen = r.chosen.includes(di);
      const o = document.createElement("div"); o.className = "rv-opt";
      const span = document.createElement("span"); span.textContent = t; o.appendChild(span);
      let tag = "";
      if(isCorrect){ o.classList.add("correct"); tag = isChosen ? "你的選擇" : "正確答案"; }
      else if(isChosen){ o.classList.add("wrong"); tag = "你的選擇"; }
      if(tag){ const em = document.createElement("em"); em.textContent = tag; o.appendChild(em); }
      opts.appendChild(o);
    });
    el.append(head, opts); wrap.appendChild(el);
  });
  box.hidden = false;
}

function shareUrl(){
  const base = site.share.url || location.href.split("#")[0].split("?")[0];
  if(!site.share.toNoSerial || CONFIG.noSerial) return base;
  try{ const u = new URL(base); u.searchParams.set("mode", "share"); return u.toString(); }
  catch(e){ return base + (base.includes("?") ? "&" : "?") + "mode=share"; }
}
function shareText(){ return site.share.text.replace("{title}", site.gameTitle).replace("{rate}", record ? record.rate : 0); }
/* 臉書／LINE 只能讀取網頁中寫好的預覽圖，無法使用玩家手機產生的圖片。
   5 題的正確率只有 0、20、40、60、80、100 六種，因此預先做好 6 個結果預覽頁（r 資料夾），
   分享時依正確率帶入對應網址；點開後會自動轉到遊戲（體驗版）。 */
function resultShareUrl(){
  const rate = record ? record.rate : null;
  const shortUrl = rate != null && site.share.shortUrls && String(site.share.shortUrls[String(rate)] || "").trim();
  if(shortUrl && /^https?:\/\//i.test(shortUrl)) return shortUrl;
  if(!site.share.resultPages || rate == null || ![0,20,40,60,80,100].includes(rate)) return shareUrl();
  let base = site.share.url || location.href.split("#")[0].split("?")[0];
  try{
    const u = new URL(base);
    u.search = ""; u.hash = "";
    if(!u.pathname.endsWith("/") && !/\.[a-z0-9]+$/i.test(u.pathname)) u.pathname += "/";
    const r = new URL("r/" + rate + ".html", u);
    if(site.share.previewVersion) r.searchParams.set("v", String(site.share.previewVersion));
    return r.toString();
  }catch(e){ return shareUrl(); }
}
function updateShareLinks(){
  const u = encodeURIComponent(resultShareUrl()), t = encodeURIComponent(shareText());
  // LINE：手機改用 LINE 官方分享網址，可帶入「說明文字＋連結」並直接開啟 LINE；電腦版維持網頁分享
  $("#shareLine").href = isMobileDevice()
    ? `https://line.me/R/share?text=${encodeURIComponent(shareText() + resultShareUrl())}`
    : `https://social-plugins.line.me/lineit/share?url=${u}&text=${t}`;
  $("#shareFB").href = `https://www.facebook.com/sharer/sharer.php?u=${u}`;
}

/* 分享圖：只呈現正確率，不含序號 */
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function makeShareImage(){
  try{ await document.fonts.ready; }catch(e){}
  const W=1080, H=1350, c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  const G="#4F6B3C", O="#EDA347", BEIGE="#E3D6C6";
  const disp = '"Huninn","PingFang TC","Noto Sans TC",sans-serif';
  x.fillStyle=BEIGE; x.fillRect(0,0,W,H);
  // 主視覺 Logo 組合圖
  let artBottom = 120;
  try{
    const art = await loadImg(ART.SHARE_LOGO);
    const aw = 860, ah = Math.round(aw * art.height / art.width);
    x.drawImage(art, (W-aw)/2, 30, aw, ah); artBottom = 30 + ah;
  }catch(e){}
  // 放射線背景（呼應主視覺），只畫在插圖下方，避免與插圖底色重疊成方框
  x.save(); x.beginPath(); x.rect(0, artBottom, W, H - artBottom); x.clip();
  x.translate(W/2, 1150); x.fillStyle="rgba(140,160,90,.16)";
  for(let i=0;i<36;i++){ x.rotate(Math.PI*2/36); x.beginPath(); x.moveTo(0,0); x.lineTo(-40,-900); x.lineTo(40,-900); x.closePath(); x.fill(); }
  x.restore();
  x.textAlign="center"; x.lineJoin="round";
  // 主標（取最後一行）
  const lines = String(site.share.imageTitle || "").split(/\n/).map(t => t.trim()).filter(Boolean);
  const title = lines.length ? lines[lines.length-1] : "";
  if(title){
    let ts = 76; x.font=`${ts}px ${disp}`;
    const tw = x.measureText(title).width; if(tw > 940){ ts = Math.floor(ts*940/tw); x.font=`${ts}px ${disp}`; }
    const ty = artBottom + 30 + ts;
    x.lineWidth=14; x.strokeStyle="#fff"; x.strokeText(title, W/2, ty);
    x.fillStyle=G; x.fillText(title, W/2, ty);
    artBottom = ty;
  }
  // 正確率印章（左）＋文字（右）
  const cy = Math.min(1120, artBottom + 230), sx = 330;
  x.save(); x.translate(sx, cy); x.rotate(-8*Math.PI/180);
  x.fillStyle="#fff"; x.beginPath(); x.arc(0,0,200,0,Math.PI*2); x.fill();
  const ring = record.passed ? O : "#9DAF7A";
  x.strokeStyle=ring; x.lineWidth=14; x.beginPath(); x.arc(0,0,176,0,Math.PI*2); x.stroke();
  x.lineWidth=5; x.beginPath(); x.arc(0,0,156,0,Math.PI*2); x.stroke();
  x.fillStyle=G; let rs=130; x.font=`${rs}px ${disp}`;
  const rw = x.measureText(record.rate+"%").width; if(rw > 280){ rs = Math.floor(rs*280/rw); x.font=`${rs}px ${disp}`; }
  x.fillText(record.rate+"%", 0, 40);
  x.fillStyle="#3A3A2E"; x.font=`38px ${disp}`; x.fillText("答題正確率", 0, 100);
  x.restore();
  const rx = 790;
  x.fillStyle=G; x.font=`64px ${disp}`;
  x.fillText(record.passed ? "挑戰成功！" : "完成挑戰！", rx, cy - 20);
  // 「你也來試試看」膠囊
  x.font=`42px ${disp}`; const pt="你也來試試看！", pw = x.measureText(pt).width + 64, ph = 72;
  const px = rx - pw/2, py = cy + 30;
  x.fillStyle=O; x.beginPath();
  if(x.roundRect) x.roundRect(px, py, pw, ph, 36); else x.rect(px, py, pw, ph);
  x.fill(); x.fillStyle="#fff"; x.fillText(pt, rx, py + 51);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
}
async function shareIG(){
  if(!record) return;
  const blob = await makeShareImage();
  const file = new File([blob], "quiz-result.jpg", {type:"image/jpeg"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], text: shareText() + shareUrl()});
      return;
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  // 無法直接分享時：下載結果圖
  let saved = false;
  if(window.claude && typeof window.claude.use === "function"){
    try{ const dl = await claude.use("downloads"); if(dl){ await dl.save({filename:"quiz-result.jpg", data: blob}); saved = true; } }
    catch(e){ if(e && e.code === "declined") return; }
  }
  if(!saved){
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "quiz-result.jpg";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }
  try{ await navigator.clipboard.writeText(shareText() + shareUrl()); }catch(e){}
  toast("結果圖已儲存，分享文字已複製。請開啟 Instagram 上傳至限時動態或貼文。");
}

function qmsg(t, ok){ const m=$("#qMsg"); m.className = ok?"ok":"err"; m.textContent = t; }
function validateQuestions(arr){
  if(!Array.isArray(arr)) return "題庫必須是陣列";
  if(arr.length < draft.questionCount) return `題庫至少需要 ${draft.questionCount} 題`;
  for(let i=0;i<arr.length;i++){
    const q = arr[i], n = `第 ${i+1} 題`;
    if(!q || typeof q.q !== "string" || !q.q.trim()) return n + "缺少題目文字";
    if(q.type !== "single" && q.type !== "multi") return n + " type 必須是 single 或 multi";
    if(!Array.isArray(q.options) || q.options.length < 2) return n + "至少需要 2 個選項";
    if(!Array.isArray(q.answer) || !q.answer.length) return n + "缺少正確答案";
    if(q.answer.some(a => !Number.isInteger(a) || a < 0 || a >= q.options.length)) return n + "答案索引超出選項範圍";
    if(q.type === "single" && q.answer.length !== 1) return n + "單選題只能有 1 個正確答案";
  }
  return "";
}

    writeSiteCache({cfg: site, imgs: images, status: serialStatus});
    applySite(); closeAdmin(); toast("已儲存版面與題庫");
  }catch(e){ console.error(e); toast("儲存失敗：" + (e.message || e.code || "請稍後再試")); }
  b.disabled = false; b.textContent = "儲存變更";
}
async function copyConfig(){
  const s = JSON.stringify({...draft, __images: draftImgs});
  try{ await navigator.clipboard.writeText(s); toast("已複製設定 JSON（含圖片）"); }
  catch(e){ $("#adminBody").insertAdjacentHTML("afterbegin", `<div class="field"><label>請手動複製</label><textarea>${escapeHtml(s)}</textarea></div>`); }
}

/* =========================================================
   6. 啟動
   ========================================================= */
function startQuiz(){ buildQuiz(); show("p-quiz"); }
$("#startBtn").addEventListener("click", startQuiz);
$("#replayBtn").addEventListener("click", startQuiz);
$("#mySerialBtn").addEventListener("click", () => { renderResult(record, false, true); show("p-result"); });
$("#submitBtn").addEventListener("click", submitQuiz);
$("#shareIG").addEventListener("click", shareIG);
/* 手機上的臉書分享：臉書 App 不處理網頁版分享網址（只會打開 App），
   因此改用系統分享選單，由玩家選擇 Facebook；不支援時改為複製連結。電腦版維持原本的分享視窗。 */
function isMobileDevice(){
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
}
$("#shareFB").addEventListener("click", async (e) => {
  if(!isMobileDevice()) return; // 電腦版：開啟臉書分享視窗
  e.preventDefault();
  // 手機：以系統分享選單分享「說明文字＋連結」，由玩家選擇 Facebook
  const url = resultShareUrl(), text = shareText();
  if(navigator.share){
    toast("請在分享選單中選擇 Facebook");
    try{ await navigator.share({ text, url }); return; }
    catch(err){ if(err && err.name === "AbortError") return; }
  }
  let copied = false;
  try{ await navigator.clipboard.writeText(text + url); copied = true; }catch(_){}
  toast(copied ? "分享文字與連結已複製，請開啟臉書並在貼文中貼上。" : "請長按複製後到臉書分享：" + text + url);
});
$("#adminFab").addEventListener("click", openAdmin);
$("#sheetClose").addEventListener("click", closeAdmin);
$("#saveCfg").addEventListener("click", saveAdmin);
$("#copyCfg").addEventListener("click", copyConfig);

if(CONFIG.siteOverrides && CONFIG.siteOverrides.__images){ images = {...CONFIG.siteOverrides.__images}; delete site.__images; }
const BASE_IMAGES = {...images};

/* 開啟速度：先用「本機快取的版面設定＋本機作答紀錄」立即顯示畫面，
   後端（Google Apps Script）在背景載入，有變動時才更新畫面，玩家不必等待。 */
const cachedSite = readSiteCache();
if(cachedSite){
  if(cachedSite.cfg) site = deepMerge(clone(DEFAULT_SITE), cachedSite.cfg);
  if(cachedSite.imgs) images = {...BASE_IMAGES, ...cachedSite.imgs};
  if(cachedSite.status) serialStatus = cachedSite.status;
}
if(!NO_SERIAL) record = getLocalRecord();
applySite();

backendReady = (async () => {
  backend = await initBackend();
  if(backend.mode === "api"){ try{ backend.adminKey = sessionStorage.getItem("quiz_admin_key") || ""; }catch(e){} }
  // 版面設定與作答紀錄同時載入
  const siteTask = (async () => {
    try{
      const {cfg, imgs} = await backend.loadSite();
      let status = null;
      try{ status = await backend.getStatus(); }catch(e){}
      return {cfg: cfg || null, imgs: imgs || {}, status};
    }catch(e){ console.warn("讀取版面設定失敗，沿用目前內容", e); return null; }
  })();
  const recordTask = NO_SERIAL ? Promise.resolve(null)
    : backend.getRecord().catch(e => { console.warn("讀取作答紀錄失敗", e); return null; });
  const [fresh, rec] = await Promise.all([siteTask, recordTask]);
  let changed = false;
  if(fresh){
    const before = JSON.stringify(cachedSite ? {cfg: cachedSite.cfg || null, imgs: cachedSite.imgs || {}, status: cachedSite.status || null} : null);
    const after = JSON.stringify(fresh);
    if(before !== after){
      site = fresh.cfg ? deepMerge(clone(DEFAULT_SITE), fresh.cfg) : deepMerge(clone(DEFAULT_SITE), CONFIG.siteOverrides);
      delete site.__images;
      images = {...BASE_IMAGES, ...fresh.imgs};
      if(fresh.status) serialStatus = fresh.status;
      changed = true;
    }
    writeSiteCache(fresh);
  }
  if(rec && JSON.stringify(rec) !== JSON.stringify(record)){ record = rec; setLocalRecord(rec); changed = true; }
  if(changed) applySite(); else updateStartBtn();
  if(backend.canEdit) $("#adminFab").classList.add("on");
  return backend;
})();
</script>
